<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#b99cf6">
  <meta name="description" content="情绪与星界的四键对唱。打开浏览器，选择练习或正式演奏。">
  <title>Friday Night Funkin’ · 同人</title>
  <link rel="icon" type="image/png" href="assets/ui/blue0000.png">
  <link rel="preload" as="image" href="assets/menu/purple-arrows.svg">
  <link rel="stylesheet" href="style.css?v=purple2">
</head>
<body data-phase="menu" data-edition="purple-duet">
<div class="viewport" id="viewport">
  <main class="app">
    <section class="stage" aria-label="节奏游戏">
      <canvas id="stage" width="1920" height="1080" tabindex="-1" aria-label="情绪与星界演奏舞台"></canvas>
      <div class="overlay menu-overlay" id="menu-overlay" data-view="home">
        <section class="home-screen" id="home-screen" aria-label="主菜单">
          <img class="hero-arrows" src="assets/menu/purple-arrows.svg" alt="" draggable="false" fetchpriority="high">
          <div class="content-margin">
            <div class="fan-mark">同人</div>
            <h1 lang="en" aria-label="Friday Night Funkin’"><span>FRIDAY</span><span>NIGHT</span><span class="word-last">FUNKIN’</span></h1>
            <nav class="home-actions" aria-label="主菜单">
              <button id="freeplay" class="ink-button">自由演奏 <span aria-hidden="true">↗</span></button>
              <button id="settings-open" class="quiet-action">声音与操作 <span aria-hidden="true">↗</span></button>
            </nav>
          </div>
        </section>
        <section class="song-screen paper-page" id="song-screen" aria-label="选曲" hidden>
          <header class="screen-head"><button id="song-back" class="back" aria-label="返回首页"><span aria-hidden="true">←</span> 首页</button><span class="crumb">自由演奏</span></header>
          <div class="release-layout">
            <div class="court-print"><img data-src="assets/packed/court.webp" alt="《要举止得体》的法庭舞台" draggable="false"></div>
            <article class="release-details">
              <h2>要举止得体</h2>
              <p class="artist">情绪 <i>×</i> 星界</p>
              <div class="modes">
                <button id="practice-start" class="ink-button" disabled>练习演奏 <span aria-hidden="true">↗</span></button>
                <button id="start" class="line-button" disabled>正式演奏 <span aria-hidden="true">↗</span></button>
              </div>
              <p id="best-score" class="best" hidden></p>
            </article>
          </div>
        </section>
        <div class="load-strip"><p id="load-status" role="status" hidden></p><button id="retry" class="text-button" hidden>重试</button></div>
      </div>
      <section class="overlay settings-screen paper-page" id="settings-overlay" aria-labelledby="settings-title" hidden>
        <header class="screen-head"><button id="settings-close" class="back" aria-label="返回首页"><span aria-hidden="true">←</span> 首页</button></header>
        <div class="settings-layout">
          <div class="settings-index">
            <h2 id="settings-title">声音与操作</h2>
            <div class="settings-tabs" role="tablist" aria-label="设置类别">
              <button id="tab-sound" role="tab" aria-selected="true" aria-controls="panel-sound">声音</button>
              <button id="tab-control" role="tab" aria-selected="false" aria-controls="panel-control" tabindex="-1">操作</button>
            </div>
          </div>
          <div class="settings-content">
            <div id="panel-sound" role="tabpanel" aria-labelledby="tab-sound">
              <label class="setting-line"><span>音乐音量</span><input id="music-volume" type="range" min="0" max="100" value="85"><output id="music-value">85%</output></label>
              <label class="setting-line"><span>效果音量</span><input id="sfx-volume" type="range" min="0" max="100" value="45"><output id="sfx-value">45%</output></label>
              <label class="setting-line"><span>失误与失败音</span><select id="failure-sound"><option value="mode">按模式</option><option value="off">关闭</option><option value="on">开启</option></select></label>
              <p class="setting-note">默认仅在正式演奏中播放失误与失败音。</p>
              <label class="setting-line"><span>正确命中音</span><input class="toggle" id="hit-sound" type="checkbox"></label>
            </div>
            <div id="panel-control" role="tabpanel" aria-labelledby="tab-control" hidden>
              <label class="setting-line"><span>音画偏移</span><input id="offset" type="range" min="-200" max="200" step="5" value="0"><output id="offset-value">0 毫秒</output></label>
              <p class="setting-note">正值让判定稍晚，负值让判定稍早。</p>
              <div class="setting-line bindings"><span>键盘映射</span><div id="key-bindings"><button data-bind="0" aria-label="更改左键">A</button><button data-bind="1" aria-label="更改下键">S</button><button data-bind="2" aria-label="更改上键">W</button><button data-bind="3" aria-label="更改右键">D</button></div></div>
              <p id="key-status" class="setting-note" role="status"></p>
            </div>
            <div class="settings-bottom"><button id="settings-reset" class="text-button">恢复默认</button><button id="settings-done" class="ink-button">完成 <span aria-hidden="true">✓</span></button></div>
          </div>
        </div>
      </section>
      <section class="overlay curtain" id="pause-overlay" aria-labelledby="pause-title" hidden>
        <div class="pause-sheet paper-sheet"><h2 id="pause-title">已暂停</h2><p id="pause-hint" class="note"></p>
          <button id="resume" class="ink-button">继续演奏 <span aria-hidden="true">▶</span></button>
          <div class="sheet-links"><button id="restart" class="text-button">重新开始</button><button id="pause-menu" class="text-button">返回选曲</button></div>
        </div>
      </section>
      <section class="overlay curtain" id="result-overlay" aria-labelledby="result-title" hidden>
        <div class="result-sheet paper-sheet">
          <div class="result-home"><p class="sheet-mark" id="result-kicker">演奏成绩</p><h2 id="result-title">演奏完成</h2><span id="new-record" class="record-mark"></span></div>
          <div class="score-block"><strong id="result-score">0</strong><span>分数</span></div>
          <div class="statistics"><div><span>准确率</span><b id="result-accuracy">0%</b></div><div><span>最高连击</span><b id="result-combo">0</b></div><div><span>失误</span><b id="result-misses">0</b></div></div>
          <div class="sheet-actions"><button id="again" class="ink-button">再来一次 <span aria-hidden="true">↺</span></button><button id="result-menu" class="text-button">返回选曲</button></div>
        </div>
      </section>
      <section class="overlay gameover-overlay" id="gameover-overlay" aria-labelledby="gameover-title" hidden>
        <h2 id="gameover-title">演奏中断</h2><div class="failure-actions"><button id="gameover-retry" class="ink-button">重新开始 <span aria-hidden="true">↺</span></button><button id="gameover-menu" class="dark-link">返回选曲</button></div>
      </section>
    </section>
    <div class="transport" aria-label="演奏控制"><button id="pause" aria-label="暂停" class="round-action" disabled><span class="pause-glyph" aria-hidden="true"></span></button><button id="fullscreen" class="round-action" aria-label="全屏"><span class="expand-glyph" aria-hidden="true"></span></button></div>
    <div class="touch-keys" role="group" aria-label="演奏方向键">
      <button data-lane="0" aria-label="左" disabled><span>←</span></button><button data-lane="1" aria-label="下" disabled><span>↓</span></button><button data-lane="2" aria-label="上" disabled><span>↑</span></button><button data-lane="3" aria-label="右" disabled><span>→</span></button>
    </div>
  </main>
</div>
<audio id="music" preload="none" data-src="assets/music.m4a" playsinline></audio>
<script src="screen.js?v=purple2"></script><script src="assets/packed/art.js?v=purple2"></script><script src="art-loader.js?v=purple2"></script><script src="assets/extra/manifest.js?v=purple2"></script><script src="ui.js?v=purple2"></script><script src="judge.js?v=purple2"></script><script src="scene.js?v=purple2"></script><script src="data.js?v=purple2"></script><script src="sounds.js?v=purple2"></script><script src="game.js?v=purple2"></script>
</body></html>
